<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustIssues - Refund Request</title>
  <style>
    /* Palette: Blue #c4dae8, Butter #feefb8, Chocopie #432f2e. The rest are tints of these three. */
    :root {
      color-scheme: light;
      --blue: #c4dae8;
      --butter: #feefb8;
      --choc: #432f2e;
      --cream: #fffaea;        /* butter, lightened: the card surface */
      --blue-soft: #e4eff6;    /* blue, lightened */
      --choc-soft: #6d5a58;    /* chocopie, softened: secondary text on cream (6.2:1) */
      --line: rgba(67, 47, 46, 0.22);
      --serif: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", "Hoefler Text", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      color: var(--choc);
      background: var(--blue);
      -webkit-font-smoothing: antialiased;
    }
    .notice {
      background: var(--choc);
      color: var(--butter);
      padding: 10px 20px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .site-header {
      padding: 56px 20px 32px;
      text-align: center;
    }
    .wordmark {
      font-family: var(--serif);
      font-weight: 800;
      font-size: clamp(44px, 9vw, 68px);
      line-height: 1;
      letter-spacing: -0.015em;
    }
    .wordmark em { font-style: italic; font-weight: 700; }
    main {
      max-width: 560px;
      margin: 0 auto 64px;
      padding: 40px 40px 44px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 28px 48px -28px rgba(67, 47, 46, 0.45);
    }
    h1 {
      margin: 0 0 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      font-family: var(--serif);
      font-weight: 800;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    label {
      display: block;
      margin-top: 22px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    form label:first-of-type { margin-top: 0; }
    .optional { font-weight: 400; color: var(--choc-soft); letter-spacing: 0.04em; text-transform: none; }
    input, select, textarea {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 11px 14px;
      font: inherit;
      color: var(--choc);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:hover, select:hover, textarea:hover { border-color: rgba(67, 47, 46, 0.45); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--choc);
      box-shadow: 0 0 0 4px var(--blue);
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 42px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23432f2e' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
    }
    textarea { resize: vertical; min-height: 104px; line-height: 1.5; }
    button {
      display: block;
      width: 100%;
      margin-top: 32px;
      padding: 15px 20px;
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--butter);
      background: var(--choc);
      border: 1px solid var(--choc);
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    button:hover:not(:disabled) { background: #5a4140; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--choc); outline-offset: 3px; }
    button:disabled { opacity: 0.55; cursor: default; }
    /* Result states differ by treatment, not only by colour: the decision is also written out in words. */
    #result {
      margin-top: 28px;
      padding: 20px 22px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
    }
    #result > div:first-child { font-family: var(--serif); font-size: 21px; line-height: 1.2; margin-bottom: 6px; }
    #result.ok { background: var(--choc); color: var(--butter); }
    #result.pending { background: var(--butter); color: var(--choc); border: 1px solid rgba(67, 47, 46, 0.3); }
    #result.error { background: var(--blue-soft); color: var(--choc); border: 1.5px solid var(--choc); }
    #result .meta { margin-top: 6px; font-size: 13px; opacity: 0.8; }
    #result ol {
      margin: 16px 0 0;
      padding: 14px 0 0 20px;
      border-top: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      font-size: 13px;
    }
    #result li { margin-top: 8px; }
    #result .agent { font-weight: 600; text-transform: capitalize; }
    @media (max-width: 520px) {
      .site-header { padding: 40px 16px 24px; }
      main { margin: 0 16px 40px; padding: 28px 22px 32px; border-radius: 16px; }
      h1 { font-size: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="notice" role="note">
    You are interacting with an AI agent. Your refund request will be reviewed by an automated system.
  </div>

  <header class="site-header">
    <div class="wordmark">Trust<em>Issues</em></div>
  </header>

  <main>
    <h1>Refund Request</h1>

    <form id="refund-form">
      <label for="customer_id">Customer ID</label>
      <input id="customer_id" name="customer_id" type="text" required>

      <label for="transaction_id">Transaction ID</label>
      <input id="transaction_id" name="transaction_id" type="text" required>

      <label for="amount">Refund amount (USD)</label>
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>

      <label for="reason">Reason</label>
      <select id="reason" name="reason" required>
        <option value="">Select a reason</option>
        <option value="damaged">Damaged</option>
        <option value="not_received">Not received</option>
        <option value="duplicate_charge">Duplicate charge</option>
      </select>

      <label for="description">Description <span class="optional">(optional)</span></label>
      <textarea id="description" name="description" maxlength="1000"></textarea>

      <button type="submit">Submit request</button>
    </form>

    <div id="result" hidden></div>
  </main>

  <script>
    const form = document.getElementById("refund-form");
    const result = document.getElementById("result");
    const button = form.querySelector("button");

    // textContent only, never innerHTML. step text comes from the customer and the LLM, so it could have html in it
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function showResult(message, kind) {
      result.replaceChildren(el("div", message));
      result.className = kind;
      result.hidden = false;
    }

    // approved / escalated / denied comes from the limit control, not from the agents
    const OUTCOME_CLASS = { approved: "ok", escalated: "pending", denied: "error", pending: "pending" };

    function showCase(body) {
      const outcome = body.outcome || "denied";
      const decision = el("div", `Decision: ${outcome}`);
      decision.style.fontWeight = "600";
      result.replaceChildren(decision, el("div", body.message));
      const meta = [];
      if (body.reference) meta.push(`Reference ${body.reference}`);
      if (body.case_id) meta.push(`Case ${body.case_id}`);
      if (meta.length) result.append(el("div", meta.join(" · "), "meta"));
      if (body.steps && body.steps.length) {
        const list = el("ol");
        for (const step of body.steps) {
          const item = el("li");
          item.append(el("span", step.agent, "agent"), ` — ${step.task}`);
          item.append(el("div", step.result.output, "meta"));
          list.append(item);
        }
        result.append(list);
      }
      result.className = OUTCOME_CLASS[outcome] || "error";
      result.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      showResult("Processing your request…", "pending");

      const data = new FormData(form);
      const payload = {
        customer_id: data.get("customer_id").trim(),
        transaction_id: data.get("transaction_id").trim(),
        amount: Number(data.get("amount")),
        reason: data.get("reason"),
        description: data.get("description").trim() || null,
      };

      try {
        const response = await fetch("/api/refund-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (response.ok) {
          showCase(body);
          if (body.outcome === "approved" || body.outcome === "escalated") form.reset();
        } else {
          showResult("The request could not be submitted. Please check the fields and try again.", "error");
        }
      } catch (err) {
        showResult("Could not reach the server. Please try again.", "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
